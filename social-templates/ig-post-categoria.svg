<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1080" width="1080" height="1080">
  <rect width="1080" height="1080" fill="#3b82f6"/>
  <rect x="40" y="40" width="1000" height="1000" rx="40" fill="#fff7ee"/>

  <!-- title -->
  <text x="80" y="140" font-family="Arial, sans-serif" font-size="30" font-weight="800" fill="#5f5a7a" letter-spacing="3">CATEGORÍA</text>
  <text x="80" y="230" font-family="Arial, sans-serif" font-size="84" font-weight="900" fill="#1c1b22">Herramientas</text>
  <text x="80" y="290" font-family="Arial, sans-serif" font-size="26" font-weight="600" fill="#5f5a7a">Todo lo que necesitás para el trabajo y el hogar</text>

  <!-- 3 product tiles -->
  <g>
    <rect x="80" y="360" width="300" height="360" rx="24" fill="#ffffff" stroke="#1c1b22" stroke-width="4"/>
    <rect x="100" y="380" width="260" height="220" rx="16" fill="#f3f4f6" stroke="#1c1b22" stroke-width="2" stroke-dasharray="8 6"/>
    <text x="230" y="500" font-family="Arial, sans-serif" font-size="18" text-anchor="middle" fill="#5f5a7a">Foto 1</text>
    <text x="100" y="640" font-family="Arial, sans-serif" font-size="22" font-weight="800" fill="#1c1b22">Producto 1</text>
    <text x="100" y="675" font-family="Arial, sans-serif" font-size="20" font-weight="900" fill="#3b82f6">$ 00.000</text>
  </g>
  <g>
    <rect x="400" y="360" width="300" height="360" rx="24" fill="#ffffff" stroke="#1c1b22" stroke-width="4"/>
    <rect x="420" y="380" width="260" height="220" rx="16" fill="#f3f4f6" stroke="#1c1b22" stroke-width="2" stroke-dasharray="8 6"/>
    <text x="550" y="500" font-family="Arial, sans-serif" font-size="18" text-anchor="middle" fill="#5f5a7a">Foto 2</text>
    <text x="420" y="640" font-family="Arial, sans-serif" font-size="22" font-weight="800" fill="#1c1b22">Producto 2</text>
    <text x="420" y="675" font-family="Arial, sans-serif" font-size="20" font-weight="900" fill="#3b82f6">$ 00.000</text>
  </g>
  <g>
    <rect x="720" y="360" width="300" height="360" rx="24" fill="#ffffff" stroke="#1c1b22" stroke-width="4"/>
    <rect x="740" y="380" width="260" height="220" rx="16" fill="#f3f4f6" stroke="#1c1b22" stroke-width="2" stroke-dasharray="8 6"/>
    <text x="870" y="500" font-family="Arial, sans-serif" font-size="18" text-anchor="middle" fill="#5f5a7a">Foto 3</text>
    <text x="740" y="640" font-family="Arial, sans-serif" font-size="22" font-weight="800" fill="#1c1b22">Producto 3</text>
    <text x="740" y="675" font-family="Arial, sans-serif" font-size="20" font-weight="900" fill="#3b82f6">$ 00.000</text>
  </g>

  <!-- sticker -->
  <g transform="translate(80,780) rotate(-3)">
    <rect x="0" y="0" width="260" height="70" rx="35" fill="#a3e635" stroke="#1c1b22" stroke-width="4"/>
    <text x="130" y="46" font-family="Arial, sans-serif" font-size="24" font-weight="800" text-anchor="middle" fill="#1c1b22">¡CONSULTÁ!</text>
  </g>

  <!-- CTA -->
  <text x="80" y="920" font-family="Arial, sans-serif" font-size="30" font-weight="800" fill="#1c1b22">Mirá todo el catálogo en el link de la bio</text>
  <text x="80" y="960" font-family="Arial, sans-serif" font-size="22" font-weight="600" fill="#5f5a7a">Consultas por WhatsApp · Envíos a todo el país</text>

  <!-- footer -->
  <line x1="80" y1="1000" x2="1000" y2="1000" stroke="#1c1b22" stroke-width="3"/>
  <text x="80" y="1040" font-family="Arial, sans-serif" font-size="24" font-weight="900" fill="#1c1b22" letter-spacing="3">ALMATE</text>
  <text x="1000" y="1040" font-family="Arial, sans-serif" font-size="16" text-anchor="end" fill="#5f5a7a">Desarrollado por ALMATE · Soluciones digitales</text>
</svg>