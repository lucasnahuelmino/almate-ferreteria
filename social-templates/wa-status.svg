<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1920" width="1080" height="1920">
  <rect width="1080" height="1920" fill="#25D366"/>
  <rect x="40" y="40" width="1000" height="1840" rx="48" fill="#fff7ee"/>

  <!-- top -->
  <text x="80" y="140" font-family="Arial, sans-serif" font-size="30" font-weight="800" fill="#5f5a7a" letter-spacing="3">ESTADO DE WHATSAPP</text>
  <text x="80" y="230" font-family="Arial, sans-serif" font-size="72" font-weight="900" fill="#1c1b22">¿Lo necesitás?</text>
  <text x="80" y="310" font-family="Arial, sans-serif" font-size="72" font-weight="900" fill="#ff6b35">Probablemente</text>
  <text x="80" y="390" font-family="Arial, sans-serif" font-size="72" font-weight="900" fill="#3b82f6">lo tenemos.</text>

  <!-- product placeholder -->
  <rect x="80" y="460" width="920" height="560" rx="40" fill="#f3f4f6" stroke="#1c1b22" stroke-width="5" stroke-dasharray="14 10"/>
  <text x="540" y="750" font-family="Arial, sans-serif" font-size="34" font-weight="700" text-anchor="middle" fill="#5f5a7a">Tu foto de producto aquí</text>

  <!-- sticker -->
  <g transform="translate(80,1060) rotate(-4)">
    <rect x="0" y="0" width="320" height="80" rx="40" fill="#fbbf24" stroke="#1c1b22" stroke-width="4"/>
    <text x="160" y="54" font-family="Arial, sans-serif" font-size="28" font-weight="800" text-anchor="middle" fill="#1c1b22">CONSULTÁ</text>
  </g>

  <!-- details -->
  <text x="80" y="1220" font-family="Arial, sans-serif" font-size="40" font-weight="900" fill="#1c1b22">Nombre del producto</text>
  <text x="80" y="1275" font-family="Arial, sans-serif" font-size="26" font-weight="600" fill="#5f5a7a">Cód. 0000</text>
  <text x="80" y="1340" font-family="Arial, sans-serif" font-size="46" font-weight="900" fill="#3b82f6">$ 00.000</text>

  <!-- CTA -->
  <rect x="80" y="1420" width="920" height="90" rx="45" fill="#1c1b22" stroke="#1c1b22" stroke-width="4"/>
  <text x="540" y="1478" font-family="Arial, sans-serif" font-size="32" font-weight="900" text-anchor="middle" fill="#ffffff">Respondé a este estado para consultar</text>

  <!-- footer -->
  <text x="80" y="1600" font-family="Arial, sans-serif" font-size="26" font-weight="900" fill="#1c1b22" letter-spacing="3">ALMATE</text>
  <text x="80" y="1640" font-family="Arial, sans-serif" font-size="18" fill="#5f5a7a">Un poco de todo. Todo con onda.</text>
  <text x="1000" y="1840" font-family="Arial, sans-serif" font-size="16" text-anchor="end" fill="#5f5a7a">Desarrollado por ALMATE · Soluciones digitales</text>
</svg>